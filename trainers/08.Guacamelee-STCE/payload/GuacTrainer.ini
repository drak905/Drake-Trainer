; Guacamelee! STCE Trainer - settings (edit, then restart the game)
; Key names: F1..F12, a single letter/digit, INSERT, HOME, END, PAGEUP, PAGEDOWN, 0x<hex VK code>, or NONE to disable.
[Keys]
God=F1
Stamina=F2
AddMoney=F3
InfMoney=F4
Jump=F5
Speed=F6
Map=F7
OHK=F8
SpeedCyc=F9
Intenso=F10
DbgMenu=F11
Help=F12

[Options]
; 1 = draw the on-screen status panel / messages, 0 = hide everything
Overlay=1
; show the key list when the game starts (F12 toggles it in game)
ShowPanelAtStart=1
; pesos given by the "Add Money" key (the game caps money at 100000)
AddMoneyAmount=10000
; speed multiplier used when Speed is switched on (1-8; F9 cycles 2/3/4 in game)
SpeedMultiplier=2
